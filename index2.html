// --- MENÚ DESPLEGABLE MÓVIL DIRECTO Y SEGURO ---
const toggle = document.getElementById('menuToggle');
const nav = document.getElementById('navlinks');

toggle.addEventListener('click', (e) => {
  e.stopPropagation();
  if (nav.style.display === 'flex') {
    nav.style.display = 'none';
  } else {
    nav.style.display = 'flex';
    nav.style.flexDirection = 'column';
    nav.style.position = 'absolute';
    nav.style.top = '70px';
    nav.style.left = '0';
    nav.style.right = '0';
    nav.style.background = '#fbf6ef';
    nav.style.padding = '20px';
    nav.style.boxShadow = '0 10px 20px rgba(0,0,0,0.1)';
  }
});

// Cerrar menú al hacer clic en cualquier opción
nav.querySelectorAll('a').forEach(link => {
  link.addEventListener('click', () => {
    if (window.innerWidth <= 700) {
      nav.style.display = 'none';
    }
  });
});

// --- MODAL DE ADMINISTRACIÓN ---
const adminModal = document.getElementById('adminModal');
const openAdminModal = document.getElementById('openAdminModal');
const closeAdminModal = document.getElementById('closeAdminModal');

openAdminModal.addEventListener('click', (e) => {
  e.preventDefault();
  adminModal.classList.add('open');
  nav.style.display = 'none';
});

closeAdminModal.addEventListener('click', () => {
  adminModal.classList.remove('open');

// Login Admin
const ADMIN_DEMO_PASSWORD = 'Sacha2009@';

const loginError = document.getElementById('loginError');

// --- GESTIÓN DE GALERÍA Y FIRESTORE ---
document.addEventListener('DOMContentLoaded', () => {
  const db = firebase.firestore();
  const storage = firebase.storage();
  const categories = [
    "Jardín de ternura",
    "Un bosque encantado",
    "Luna, sueños y estrellas",
    "Mariposas de ilusión",
    "Arcoíris de amor",
    "Un osito para soñar"
  ];
  const galleryContainer = document.getElementById('galleryContainer');

  function renderGallery(photosData = {}) {
    galleryContainer.innerHTML = '';
    categories.forEach(cat => {
      const photo = photosData[cat];
      const card = document.createElement('article');
      card.className = 'gallery-item';
      if (photo) {
        card.innerHTML = `<img src="${photo.url}" alt="${photo.title}"><div class="gallery-caption">${photo.title}</div>`;
      } else {
        card.innerHTML = `<div style="padding:40px;text-align:center;background:#e7d9c9;height:100%;display:grid;place-items:center;"><h3>${cat}</h3><p style="font-size:0.8rem;color:#82766b">Sin foto asignada</p></div>`;
      }
      galleryContainer.appendChild(card);
    });
  }

  db.collection("photos").onSnapshot((snapshot) => {
    let photosData = {};
    snapshot.forEach((doc) => {
      let data = doc.data();
      photosData[data.category] = data;
    });
    renderGallery(photosData);
  }, (err) => {
    renderGallery({});
  });

  const uploadForm = document.getElementById('uploadForm');
  const uploadBtn = document.getElementById('uploadBtn');

  uploadForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const file = document.getElementById('photoFile').files[0];
    const title = document.getElementById('photoTitle').value || document.getElementById('categorySelect').value;
    const category = document.getElementById('categorySelect').value;

    if (!file) return alert("Selecciona una foto");
    uploadBtn.textContent = "Subiendo...";
    uploadBtn.disabled = true;

    try {
      const ref = storage.ref(`photos/${Date.now()}_${file.name}`);
      const snap = await ref.put(file);
      const url = await snap.ref.getDownloadURL();

      await db.collection("photos").doc(category).set({
        title: title,
        category: category,
        url: url,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      alert("¡Foto publicada con éxito en " + category + "!");
      adminModal.classList.remove('open');
      uploadForm.reset();
    } catch (err) {
      alert("Error al subir la foto. Revisa la consola.");
    } finally {
      uploadBtn.textContent = "Publicar Foto";
      uploadBtn.disabled = false;
    }
  });
});
</script>
